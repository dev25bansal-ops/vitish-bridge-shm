# Mosquitto broker config — local only, zero venue-WiFi dependency.
#
# SEC-01: the compose entrypoint appends the secure-mode overrides (password
# file + allow_anonymous false + ACL) when VITISH_MQTT_USER/PASS are set; the
# DEFAULT is anonymous (the one-command demo).  The password file is generated
# at container start so a pre-computed hash is never baked into the image.
listener 1883
allow_anonymous true

# WebSocket listener for the twin fallback path
listener 9001
protocol websockets
allow_anonymous true

log_type information
persistence false
