name: CI — backend gates + twin checks

# Runs the unified test runner (scripts/run_tests.sh) on every push and PR.
# The runner executes every standalone test script (backend/tests/ + the e2e
# stack smoke + the arc verifier scripts/verify_demo_arc.py); any failure fails
# the job.  The pinned demo arc (GREEN 87.1 -> AMBER 67.5 -> RED 33.6) is one of
# them (test_demo_arc.py + verify_demo_arc.py) and must NEVER break.
# PostHackathon TEST-F3: under CI the runner FAILS any trained-ML gate that
# prints TRAINED_REAL_DATA=SKIP — the committed weights + Z24 fixture must make
# them RUN real evidence on a fresh clone (no silent skip).
# Item 13: a second job (pg-store) starts a postgres:16 service and runs
# backend/scripts/ci_pg_path.py against the real SQL path + failover latch; it
# stays OUT of the main runner so the suite remains air-gapped/Postgres-free.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unified backend test runner
        env:
          PYTHONIOENCODING: utf-8
          OPENBLAS_NUM_THREADS: '1'
        run: bash scripts/run_tests.sh

      - name: Install twin dependencies
        run: |
          cd twin
          npm ci || npm install

      - name: Twin lint (eslint, max-warnings=0)
        run: |
          cd twin
          npm run lint

      - name: Twin unit tests (vitest)
        run: |
          cd twin
          npm run test

      - name: Twin typecheck (tsc --noEmit)
        run: |
          cd twin
          npm run typecheck

      - name: Twin production build (tsc + vite build)
        run: |
          cd twin
          npm run build

  # Item 13 — Postgres service CI job exercising the SQL path + failover latch.
  # A postgres:16 service container is published on localhost:5432; the job sets
  # VITISH_DB_DSN so ci_pg_path.py executes REAL SQL evidence (no silent SKIP:
  # CI=1 downgrades a missing-DSN SKIP to a failure).
  pg-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vitish_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Postgres SQL path + failover latch
        env:
          CI: '1'
          PYTHONIOENCODING: utf-8
          VITISH_DB_DSN: postgresql://postgres:postgres@127.0.0.1:5432/vitish_test
        run: python backend/scripts/ci_pg_path.py

